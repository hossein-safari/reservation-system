name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: reservation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d reservation_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: pip install -r requirements-dev.lock
      - run: ruff check . && ruff format --check . && mypy app tests/unit tests/fakes
      - run: pytest
      - run: pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/reservation_test
      - name: Verify migration consistency
        run: alembic upgrade head && alembic check

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint && npm run format:check && npm test && npm run build

  containers:
    needs: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example up --build -d --wait --wait-timeout 120
      - name: Check API and web proxy
        run: |
          curl --fail http://localhost:8000/health/ready
          curl --fail http://localhost:8080/api/v1/resources
      - name: Container logs on failure
        if: failure()
        run: docker compose --env-file .env.example logs --tail=100
      - name: Remove temporary CI containers
        if: always()
        run: docker compose --env-file .env.example down --volumes
