34E;stroke-width:1;"/><text x="102.5" y="1018.886" fill="#000" font-size="14" textLength="207.143">*payment_id : UUID «FK, UQ»</text><text x="102.5" y="1035.183" fill="#000" font-size="14" textLength="237.063">*reference : VARCHAR(160) «UQ»</text><text x="102.5" y="1051.479" fill="#000" font-size="14" textLength="144.771">*amount_irr : BIGINT</text><text x="102.5" y="1067.776" fill="#000" font-size="14" textLength="194.605">*created_at : TIMESTAMPTZ</text><line x1="97.5" y1="1075.078" x2="385.531" y2="1075.078" style="stroke:#57534E;stroke-width:1;"/><text x="102.5" y="1092.073" fill="#000" font-size="14" textLength="278.031">ck_transaction_amount: amount_irr > 0</text></g><g class="entity" data-qualified-name="GMN12" id="ent0013" data-source-line="97"><path d="M619.5,245.297 L619.5,289.797 L601.545,293.797 L619.5,297.797 L619.5,342.094 A2,2 0 0 0 621.5,344.094 L947.669,344.094 A2,2 0 0 0 949.669,342.094 L949.669,253.297 L939.669,243.297 L621.5,243.297 A2,2 0 0 0 619.5,245.297" style="stroke:#A8A29E;stroke-width:0.5;" fill="#FFFDF5"/><path d="M939.669,243.297 L939.669,252.297 A1,1 0 0 0 940.669,253.297 L949.669,253.297 L939.669,243.297" style="stroke:#A8A29E;stroke-width:0.5;" fill="#FFFDF5"/><text x="625.5" y="260.364" fill="#000" font-size="13" textLength="245.54">PostgreSQL only: ex_slots_no_overlap</text><text x="625.5" y="275.497" fill="#000" font-size="13" textLength="143.781">EXCLUDE USING gist (</text><text x="633.765" y="290.629" fill="#000" font-size="13" textLength="132.856">resource_id WITH =,</text><text x="633.765" y="305.762" fill="#000" font-size="13" textLength="275.939">tstzrange(starts_at, ends_at, '[)') WITH &amp;&amp;</text><text x="625.5" y="320.895" fill="#000" font-size="13">)</text><text x="625.5" y="336.028" fill="#000" font-size="13" textLength="309.169">Requires btree_gist; adjacent slots are allowed.</text></g><g class="entity" data-qualified-name="GMN15" id="ent0016" data-source-line="106"><path d="M405.5,497.797 L405.5,549.797 L387.229