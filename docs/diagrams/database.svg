="115"><rect x="12" y="1121.297" width="473.572" height="91.484" fill="none" style="stroke:#000;stroke-width:1;" rx="2" ry="2"/><ellipse cx="22.5" cy="1135.094" rx="2.5" ry="2.5" fill="#000"/><text x="29" y="1139.292" fill="#000" font-size="14" textLength="450.687">= NOT NULL; PK = primary key; FK = foreign key; UQ = UNIQUE</text><text x="17" y="1155.589" fill="#000" font-size="14" textLength="463.572">All foreign keys reference the parent's id; ON DELETE NO ACTION.</text><text x="17" y="1171.886" fill="#000" font-size="14" textLength="412.604">Timestamps are handled as UTC; amounts are integer IRR.</text><text x="17" y="1188.183" fill="#000" font-size="14" textLength="392.889">Technical table (no business relations): alembic_version</text><text x="17" y="1204.479" fill="#000" font-size="14" textLength="364.314">version_num VARCHAR(32) NOT NULL PRIMARY KEY</text></g></g></svg>