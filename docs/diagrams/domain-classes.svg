678.5" y="477.364" fill="#000" font-size="13" textLength="139.534">reservation_id (UUID)</text><text x="689.707" y="492.497" fill="#000" font-size="13" textLength="117.121">ensure_matches()</text></g><g class="link" data-entity-1="ent0007" data-entity-2="ent0008" id="lnk16" data-link-type="dependency"><polygon points="1081.958,595.712,1080.452,585.979,1079.252,591.507,1073.724,590.308,1081.958,595.712" fill="#57534E" style="stroke:#57534E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M985.204,445.35 C1018.755,497.491 1054.98,553.785 1079.252,591.507" style="stroke:#57534E;stroke-width:1;" fill="none"/><text x="1021.5" y="484.864" fill="#000" font-size="13" textLength="39.946">status</text></g><g class="link" data-entity-1="ent0009" data-entity-2="ent0007" id="lnk17" data-link-type="dependency"><polygon points="920.5,242.029,924.5,233.029,920.5,237.029,916.5,233.029,920.5,242.029" fill="#57534E" style="stroke:#57534E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M920.5,187.569 C920.5,204.771 920.5,218.601 920.5,237.029" style="stroke:#57534E;stroke-width:1;stroke-dasharray:7,7;" fill="none"/><text x="922.5" y="219.364" fill="#000" font-size="13" textLength="123.424">payment_id (UUID)</text></g><g class="legend" data-source-line="118"><rect x="12" y="1158.297" width="495.864" height="124.078" fill="none" style="stroke:#000;stroke-width:1;" rx="2" ry="2"/><text x="17" y="1176.292" fill="#000" font-size="14" textLength="411.517">All entities are dataclass(eq=False); IDs default to uuid4().</text><text x="17" y="1192.589" fill="#000" font-size="14" textLength="463.771">created_at defaults to utcnow(); monetary values use integer IRR.</text><text x="17" y="1208.886" fill="#000" font-size="14" textLength="391.521">Amount validation: 0 &lt; amount &lt;= 1,000,000,000,000.</text><text x="17" y="1225.183" fill="#000" font-size="14" textLength="59.377" text-decoration="underline">post_init</text><text x="80.827" y="1225.183" fill="#000" font-size="14" textLength="403.895">validation and generated dataclass methods are omitted.</text><text x="17" y="1241.479" fill="#000" font-size="14" textLength="485.864">Dashed entity links identify UUID references, not stored object fields.</text><text x="17" y="1257.776" fill="#000" font-size="14" textLength="480.826">Reservation.slot is optional in memory; its SQL mapping is viewonly.</text><text x="17" y="1274.073" fill="#000" font-size="14" textLength="427.772">Database cardinalities and constraints are in database.puml.</text></g></g></svg>